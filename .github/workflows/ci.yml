name: CI

on:
  pull_request:
  push:
    branches: [main]
  # prw-release.yml runs it before building a release (plan-jobs in dist-workspace.toml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validate the plugin and marketplace
        run: claude plugin validate .
      - name: Run the mod's tests
        run: claude plugin test .

  companion:
    name: companion (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  companion-web:
    name: companion (web page)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/crates/prw/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/crates/prw/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # The binary embeds dist/ as committed: it must be this build, new files and all.
      - name: Build, and check dist/ is the build
        run: |
          npm run build
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"

  companion-nix:
    name: companion (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build with nix (runs the tests too)
        run: nix build .#prw -L && ./result/bin/prw --version
      - name: Flake check
        run: nix flake check
