[package]
name = "prw"
description = "A PR manager for the terminal: your open PRs, saved searches and agents' PRs in one TUI (companion to the pr-watch Claude Code mod)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["github", "pull-requests", "tui", "ratatui", "claude"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "prw"
path = "src/main.rs"

[dependencies]
prw-core.workspace = true
serde_json.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
tui-markdown.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# Released by dist (dist-workspace.toml) though not on crates.io (yet).
[package.metadata.dist]
dist = true
