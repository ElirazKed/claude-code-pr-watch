[workspace]
resolver = "3"
members = ["crates/prw-core", "crates/prw"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ElirazKed/claude-code-pr-watch"
homepage = "https://github.com/ElirazKed/claude-code-pr-watch"

[workspace.dependencies]
prw-core = { path = "crates/prw-core" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
regex = "1"
unicode-width = "0.2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
